# PostgreSQL for the Online Store Database. Credentials and port come from .env:
#   docker compose --env-file .env up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # The concurrency test opens 100+ simultaneous connections
    command: ["postgres", "-c", "max_connections=250"]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  store_pgdata:
