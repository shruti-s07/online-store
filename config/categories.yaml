# Product taxonomy for the Indian storefront, used by the seed command and the synthetic data
# generators. Brands are fictional. Prices are in INR (GST inclusive).
# season: monthly demand multipliers Jan..Dec (Indian festive, wedding, summer and cricket seasons).
# nouns: product types; icon = Material Design Icons glyph used to draw the catalogue image;
#        price = typical Indian retail range in ₹ for that type (falls back to the category price_range).
# aspects: words customers use in reviews (also the aspect lexicon for pros/cons).
# blurb: one line added to every product description in the category.
